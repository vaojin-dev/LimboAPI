name: Build

on:
  push:
    branches: ["master"]
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: gradle

      - name: Cache generated data
        uses: actions/cache@v5
        with:
          path: |
            plugin/build/minecraft/
            plugin/build/generated/minecraft/mapping/
          key: minecraft-${{ hashFiles('gradle.properties') }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Publish to GitHub Packages
        if: github.ref == 'refs/heads/master'
        run: ./gradlew :plugin:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find main JAR
        id: find-jar
        run: |
          jarpath="$(find plugin/build/libs -maxdepth 1 -type f -name "*.jar" \
            ! -name "*-javadoc.jar" ! -name "*-sources.jar" | head -n 1)"
          if [ -z "$jarpath" ]; then
            echo "No jar found in plugin/build/libs" >&2
            exit 1
          fi
          echo "jarpath=$jarpath" >> $GITHUB_OUTPUT

      # dev-build (Runs only on main branch pushes)

      - name: Delete previous dev-build tag & release
        if: github.ref == 'refs/heads/master'
        run: |
          gh release delete dev-build --yes --cleanup-tag || true
          git push origin :refs/tags/dev-build || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Git short SHA
        if: github.ref == 'refs/heads/master'
        id: git-version
        run: echo "id=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Create dev-build Pre-release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-build
          name: Dev-build ${{ steps.git-version.outputs.id }}
          files: ${{ steps.find-jar.outputs.jarpath }}
          prerelease: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # versioned release (Runs only on tag pushes)

      - name: Check if tag is Pre-release
        if: startsWith(github.ref, 'refs/tags/')
        id: prerelease_check
        run: |
          if [[ "${{ github.ref }}" == *"-"* ]]; then
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find-jar.outputs.jarpath }}
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
